<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Warble UI overview</title>
  <desc id="desc">A stylized overview of Warble showing capture, models, and settings views in a dark desktop UI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050817"/>
      <stop offset="55%" stop-color="#0B1223"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1325"/>
      <stop offset="100%" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8CFF"/>
      <stop offset="100%" stop-color="#1DE1B5"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#183763"/>
      <stop offset="100%" stop-color="#244B86"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#020612" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="300" cy="170" r="180" fill="#27417A" opacity="0.35" filter="url(#glow)"/>
  <circle cx="980" cy="120" r="210" fill="#0D6E78" opacity="0.24" filter="url(#glow)"/>
  <circle cx="1370" cy="720" r="220" fill="#102B5A" opacity="0.28" filter="url(#glow)"/>

  <g transform="translate(88 78)">
    <rect x="0" y="0" width="54" height="54" rx="16" fill="#5B8CFF" opacity="0.95"/>
    <path d="M17 31c4-7 8-7 12 0 4-7 8-7 12 0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17 23c4 7 8 7 12 0 4 7 8 7 12 0" stroke="#CFE1FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="24" fill="#F8FAFC" font-size="54" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Warble</text>
    <text x="72" y="62" fill="#A9B4CB" font-size="24" font-family="Segoe UI, Arial, sans-serif">Local-first dictation and transcription with live preview, model switching,</text>
    <text x="72" y="94" fill="#A9B4CB" font-size="24" font-family="Segoe UI, Arial, sans-serif">history, cleanup, and one-step paste into the app you are already using.</text>
  </g>

  <g transform="translate(1120 74)">
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#163B32" stroke="#1F7A63"/>
    <text x="65" y="27" text-anchor="middle" fill="#D2FBEF" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Local-first</text>
    <rect x="146" y="0" width="96" height="42" rx="21" fill="#32231B" stroke="#8B5E3C"/>
    <text x="194" y="27" text-anchor="middle" fill="#FFE1C4" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Alpha</text>
    <rect x="258" y="0" width="170" height="42" rx="21" fill="#172A52" stroke="#4B6DB2"/>
    <text x="343" y="27" text-anchor="middle" fill="#D6E3FF" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Windows-focused</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="210" width="620" height="610" rx="28" fill="url(#panel)" stroke="#22304D"/>
    <rect x="80" y="210" width="620" height="46" rx="28" fill="#141A28"/>
    <circle cx="118" cy="233" r="6" fill="#F97373"/>
    <circle cx="140" cy="233" r="6" fill="#F7C45D"/>
    <circle cx="162" cy="233" r="6" fill="#4ADE80"/>
    <text x="186" y="240" fill="#CDD5E8" font-size="20" font-family="Segoe UI, Arial, sans-serif">Capture</text>

    <rect x="112" y="286" width="260" height="86" rx="18" fill="#111A2D" stroke="#23324E"/>
    <text x="136" y="320" fill="#97A6C1" font-size="18" font-family="Segoe UI, Arial, sans-serif">Model</text>
    <text x="136" y="352" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Parakeet TDT</text>

    <rect x="390" y="286" width="268" height="86" rx="18" fill="#111A2D" stroke="#23324E"/>
    <text x="414" y="320" fill="#97A6C1" font-size="18" font-family="Segoe UI, Arial, sans-serif">Input</text>
    <text x="414" y="352" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Segoe UI, Arial, sans-serif">USB microphone</text>

    <rect x="112" y="392" width="546" height="386" rx="22" fill="#0A1020" stroke="#22304D"/>
    <text x="136" y="432" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Capture</text>
    <rect x="220" y="414" width="76" height="34" rx="17" fill="#173B31" stroke="#1F7A63"/>
    <text x="258" y="436" text-anchor="middle" fill="#D2FBEF" font-size="16" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Ready</text>

    <text x="136" y="486" fill="#9AA8C0" font-size="18" font-family="Segoe UI, Arial, sans-serif">Microphone</text>
    <rect x="136" y="504" width="504" height="52" rx="12" fill="#070B16" stroke="#23324E"/>
    <text x="154" y="536" fill="#E7ECF6" font-size="20" font-weight="600" font-family="Segoe UI, Arial, sans-serif">OBSBOT Tiny 3 Lite Microphone</text>

    <text x="136" y="590" fill="#8F9DB6" font-size="17" font-family="Segoe UI, Arial, sans-serif">48000 Hz</text>
    <text x="230" y="590" fill="#8F9DB6" font-size="17" font-family="Segoe UI, Arial, sans-serif">2 ch</text>
    <text x="290" y="590" fill="#8F9DB6" font-size="17" font-family="Segoe UI, Arial, sans-serif">Default device</text>

    <rect x="136" y="620" width="182" height="52" rx="12" fill="#151D2B" stroke="#2C3A56"/>
    <text x="227" y="652" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Transcribe File</text>
    <rect x="332" y="620" width="178" height="52" rx="12" fill="#151D2B" stroke="#2C3A56"/>
    <text x="421" y="652" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Hold to Dictate</text>
    <rect x="136" y="686" width="160" height="52" rx="12" fill="#151D2B" stroke="#2C3A56"/>
    <text x="216" y="718" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Toggle Dictation</text>

    <rect x="530" y="434" width="110" height="40" rx="10" fill="#151D2B" stroke="#2C3A56"/>
    <text x="585" y="460" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Refresh</text>

    <rect x="528" y="510" width="112" height="44" rx="22" fill="#050914" stroke="#1A2338"/>
    <circle cx="556" cy="532" r="8" fill="#FB7185"/>
    <g fill="#1DE1B5">
      <rect x="590" y="523" width="6" height="16" rx="2"/>
      <rect x="600" y="518" width="6" height="21" rx="2"/>
      <rect x="610" y="512" width="6" height="27" rx="2"/>
      <rect x="620" y="516" width="6" height="23" rx="2"/>
      <rect x="630" y="521" width="6" height="18" rx="2"/>
    </g>

    <rect x="330" y="692" width="310" height="66" rx="16" fill="#0E1627" stroke="#22304D"/>
    <text x="350" y="721" fill="#9AA8C0" font-size="17" font-family="Segoe UI, Arial, sans-serif">Output</text>
    <text x="350" y="746" fill="#F8FAFC" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Paste into active app</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="210" width="780" height="280" rx="28" fill="url(#panel)" stroke="#22304D"/>
    <rect x="740" y="210" width="780" height="46" rx="28" fill="#141A28"/>
    <circle cx="778" cy="233" r="6" fill="#F97373"/>
    <circle cx="800" cy="233" r="6" fill="#F7C45D"/>
    <circle cx="822" cy="233" r="6" fill="#4ADE80"/>
    <text x="846" y="240" fill="#CDD5E8" font-size="20" font-family="Segoe UI, Arial, sans-serif">Models</text>

    <text x="778" y="304" fill="#F8FAFC" font-size="26" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Batch models</text>
    <rect x="778" y="330" width="344" height="126" rx="20" fill="#10182B" stroke="#23324E"/>
    <text x="806" y="368" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Parakeet TDT</text>
    <rect x="980" y="346" width="76" height="30" rx="15" fill="#173B31" stroke="#1F7A63"/>
    <text x="1018" y="366" text-anchor="middle" fill="#D2FBEF" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Active</text>
    <text x="806" y="400" fill="#97A6C1" font-size="18" font-family="Segoe UI, Arial, sans-serif">0.6B  FastConformer + TDT</text>
    <text x="806" y="432" fill="#C9D3E6" font-size="19" font-family="Segoe UI, Arial, sans-serif">Default final transcription engine with DirectML-first acceleration.</text>

    <rect x="1154" y="330" width="328" height="126" rx="20" fill="#10182B" stroke="#23324E"/>
    <text x="1182" y="368" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Live preview models</text>
    <rect x="1182" y="390" width="238" height="36" rx="18" fill="url(#pill)" stroke="#4166A8"/>
    <text x="1301" y="414" text-anchor="middle" fill="#E8F1FF" font-size="17" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Nemotron Streaming  Auto</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="520" width="780" height="300" rx="28" fill="url(#panel)" stroke="#22304D"/>
    <rect x="740" y="520" width="780" height="46" rx="28" fill="#141A28"/>
    <circle cx="778" cy="543" r="6" fill="#F97373"/>
    <circle cx="800" cy="543" r="6" fill="#F7C45D"/>
    <circle cx="822" cy="543" r="6" fill="#4ADE80"/>
    <text x="846" y="550" fill="#CDD5E8" font-size="20" font-family="Segoe UI, Arial, sans-serif">Settings</text>

    <rect x="778" y="598" width="184" height="188" rx="22" fill="#10182B" stroke="#23324E"/>
    <rect x="792" y="612" width="156" height="70" rx="18" fill="#151D2B" stroke="#2C3A56"/>
    <text x="812" y="642" fill="#F8FAFC" font-size="20" font-weight="700" font-family="Segoe UI, Arial, sans-serif">General</text>
    <text x="812" y="668" fill="#94A3BC" font-size="16" font-family="Segoe UI, Arial, sans-serif">Output and storage preferences.</text>
    <rect x="792" y="694" width="156" height="78" rx="18" fill="#0D1322" stroke="#E6EDF8"/>
    <text x="812" y="728" fill="#F8FAFC" font-size="20" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Shortcuts</text>
    <text x="812" y="754" fill="#94A3BC" font-size="16" font-family="Segoe UI, Arial, sans-serif">Global recording hotkeys.</text>

    <rect x="990" y="598" width="492" height="188" rx="22" fill="#10182B" stroke="#23324E"/>
    <text x="1020" y="636" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Appearance</text>
    <text x="1020" y="672" fill="#9AA8C0" font-size="18" font-family="Segoe UI, Arial, sans-serif">HUD position</text>
    <rect x="1206" y="650" width="236" height="44" rx="12" fill="#070B16" stroke="#23324E"/>
    <text x="1324" y="679" text-anchor="middle" fill="#F8FAFC" font-size="19" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Bottom center</text>
    <text x="1020" y="728" fill="#9AA8C0" font-size="18" font-family="Segoe UI, Arial, sans-serif">Animation</text>
    <rect x="1206" y="706" width="236" height="44" rx="12" fill="#070B16" stroke="#23324E"/>
    <text x="1324" y="735" text-anchor="middle" fill="#F8FAFC" font-size="19" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Bars</text>
    <rect x="1034" y="706" width="124" height="44" rx="22" fill="#050914" stroke="#1A2338"/>
    <circle cx="1062" cy="728" r="8" fill="#FB7185"/>
    <g fill="#1DE1B5">
      <rect x="1086" y="720" width="6" height="16" rx="2"/>
      <rect x="1096" y="714" width="6" height="22" rx="2"/>
      <rect x="1106" y="717" width="6" height="19" rx="2"/>
      <rect x="1116" y="711" width="6" height="25" rx="2"/>
      <rect x="1126" y="719" width="6" height="17" rx="2"/>
    </g>
  </g>

  <g transform="translate(82 840)">
    <rect x="0" y="-28" width="1436" height="1" fill="#20304E"/>
    <text x="0" y="0" fill="#94A3BC" font-size="18" font-family="Segoe UI, Arial, sans-serif">Windows-first alpha with offline models, live HUD preview, cleanup, searchable history, and tray-based global shortcuts.</text>
  </g>
</svg>
