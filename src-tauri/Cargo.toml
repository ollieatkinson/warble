[package]
name = "warble"
version = "0.1.0"
description = "A local-first push-to-talk transcription overlay."
authors = ["Oliver Atkinson"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "warble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["serde", "clock"] }
cpal = "0.15"
hound = "3"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-24"] }
parakeet-rs = { version = "0.3.4", default-features = false, features = ["cpu", "ort-defaults"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", features = ["aac", "mp3", "flac", "isomp4", "mkv", "ogg", "vorbis", "wav", "pcm", "aiff"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"

[target."cfg(target_os = \"windows\")".dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["directml"] }
parakeet-rs = { version = "0.3.4", default-features = false, features = ["directml"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(target_os = \"macos\")".dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["coreml", "webgpu", "copy-dylibs"] }
parakeet-rs = { version = "0.3.4", default-features = false, features = ["coreml", "webgpu"] }
block2 = "0.6.2"
core-graphics = "0.24"
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "block2"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGEvent"] }

[target."cfg(target_os = \"linux\")".dependencies]
# load-dynamic avoids statically linking ort-sys, which requires glibc 2.38+
# (the bundled ORT references __isoc23_strtoll). Linux defaults to CPU at runtime.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic"] }
parakeet-rs = { version = "0.3.4", default-features = false, features = ["load-dynamic"] }
x11 = { version = "2.21", features = ["xlib", "xtest"] }

[dev-dependencies]
tempfile = "3"
