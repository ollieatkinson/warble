name: release-artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            artifact_path: artifacts/linux
            artifact_name: release-linux
          - os: windows-2022
            label: Windows
            artifact_path: artifacts/windows
            artifact_name: release-windows
          - os: macos-14
            label: macOS
            artifact_path: artifacts/macos
            artifact_name: release-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Check out requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' }}
        run: git checkout --force "${{ inputs.ref }}"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxdo-dev \
            libxtst-dev \
            patchelf \
            rpm \
            wget

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm release:artifacts

      - name: Verify macOS app bundle signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail

          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No macOS app bundle found to verify" >&2
            exit 1
          fi

          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"
          spctl -a -vvv --type exec "$APP_PATH" || true

      - name: Verify macOS DMG install path
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail

          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$DMG_PATH" ]; then
            echo "No macOS DMG found to verify" >&2
            exit 1
          fi

          MOUNT_ROOT="$(mktemp -d)"
          STAGING_ROOT="$(mktemp -d)"

          cleanup() {
            if mount | grep -q "on ${MOUNT_ROOT} "; then
              hdiutil detach "$MOUNT_ROOT" -quiet || true
            fi
            rm -rf "$MOUNT_ROOT" "$STAGING_ROOT"
          }

          trap cleanup EXIT

          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_ROOT" -quiet

          MOUNTED_APP_PATH="$(find "$MOUNT_ROOT" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$MOUNTED_APP_PATH" ]; then
            echo "Mounted DMG does not contain an app bundle" >&2
            exit 1
          fi

          INSTALLED_APP_PATH="$STAGING_ROOT/$(basename "$MOUNTED_APP_PATH")"
          ditto "$MOUNTED_APP_PATH" "$INSTALLED_APP_PATH"

          if [ ! -d "$INSTALLED_APP_PATH/Contents/_CodeSignature" ]; then
            echo "Installed app bundle is missing _CodeSignature" >&2
            exit 1
          fi

          codesign --verify --deep --strict "$INSTALLED_APP_PATH"
          codesign -dv --verbose=4 "$INSTALLED_APP_PATH"
          spctl -a -vvv --type exec "$INSTALLED_APP_PATH" || true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
