name: release-artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            artifact_path: artifacts/linux
            artifact_name: release-linux
          - os: windows-2022
            label: Windows
            artifact_path: artifacts/windows
            artifact_name: release-windows
          - os: macos-14
            label: macOS
            artifact_path: artifacts/macos
            artifact_name: release-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Check out requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' }}
        run: git checkout --force "${{ inputs.ref }}"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxdo-dev \
            libxtst-dev \
            patchelf \
            rpm \
            wget

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate macOS code signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "Missing macOS signing secrets. Configure APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, and APPLE_SIGNING_IDENTITY for release builds." >&2
            exit 1
          fi

      - name: Verify macOS signing identity
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          if [ "${APPLE_SIGNING_IDENTITY}" = "-" ]; then
            echo "APPLE_SIGNING_IDENTITY must be a real Apple signing identity, not ad hoc '-'. TCC microphone prompts are unreliable on ad hoc-signed builds." >&2
            exit 1
          fi

      - name: Build release artifacts
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: pnpm release:artifacts

      - name: Verify macOS app bundle signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail

          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No macOS app bundle found to verify" >&2
            exit 1
          fi

          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"
          spctl -a -vvv --type exec "$APP_PATH" || true

      - name: Verify macOS DMG install path
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail

          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$DMG_PATH" ]; then
            echo "No macOS DMG found to verify" >&2
            exit 1
          fi

          MOUNT_ROOT="$(mktemp -d)"
          STAGING_ROOT="$(mktemp -d)"

          cleanup() {
            hdiutil detach "$MOUNT_ROOT" -quiet || true
            rm -rf "$MOUNT_ROOT" "$STAGING_ROOT"
          }

          trap cleanup EXIT

          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_ROOT" -quiet

          MOUNTED_APP_PATH="$(find "$MOUNT_ROOT" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$MOUNTED_APP_PATH" ]; then
            echo "Mounted DMG does not contain an app bundle" >&2
            exit 1
          fi

          INSTALLED_APP_PATH="$STAGING_ROOT/$(basename "$MOUNTED_APP_PATH")"
          ditto "$MOUNTED_APP_PATH" "$INSTALLED_APP_PATH"

          if [ ! -d "$INSTALLED_APP_PATH/Contents/_CodeSignature" ]; then
            echo "Installed app bundle is missing _CodeSignature" >&2
            exit 1
          fi

          codesign --verify --deep --strict "$INSTALLED_APP_PATH"
          codesign -dv --verbose=4 "$INSTALLED_APP_PATH"
          spctl -a -vvv --type exec "$INSTALLED_APP_PATH" || true

      - name: Verify Linux package install paths
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          APP_BINARY="$(node -p "require('./package.json').name")"
          APPIMAGE_PATH="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          DEB_PATH="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          RPM_PATH="$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"

          if [ -z "$APPIMAGE_PATH" ] || [ -z "$DEB_PATH" ] || [ -z "$RPM_PATH" ]; then
            echo "Missing one or more Linux artifacts to verify" >&2
            exit 1
          fi

          APPIMAGE_ROOT="$(mktemp -d)"
          DEB_ROOT="$(mktemp -d)"

          cleanup() {
            rm -rf "$APPIMAGE_ROOT" "$DEB_ROOT"
          }

          trap cleanup EXIT

          cp "$APPIMAGE_PATH" "$APPIMAGE_ROOT/app.AppImage"
          chmod +x "$APPIMAGE_ROOT/app.AppImage"
          (
            cd "$APPIMAGE_ROOT"
            ./app.AppImage --appimage-extract >/dev/null
          )

          test -f "$APPIMAGE_ROOT/squashfs-root/AppRun"
          test -x "$APPIMAGE_ROOT/squashfs-root/usr/bin/$APP_BINARY"

          dpkg-deb --info "$DEB_PATH" >/dev/null
          DEB_CONTENTS="$(dpkg-deb --contents "$DEB_PATH")"
          printf '%s\n' "$DEB_CONTENTS" | grep -Eq "(^|[[:space:]])(\\./)?usr/bin/$APP_BINARY$"
          dpkg-deb -x "$DEB_PATH" "$DEB_ROOT"
          test -x "$DEB_ROOT/usr/bin/$APP_BINARY"

          rpm -qip "$RPM_PATH" >/dev/null
          RPM_CONTENTS="$(rpm -qlp "$RPM_PATH")"
          printf '%s\n' "$RPM_CONTENTS" | grep -q "^/usr/bin/$APP_BINARY$"

      - name: Verify Windows package install paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $appBinaryBase = (node -p "require('./package.json').name").Trim()
          $appBinary = "$appBinaryBase.exe"
          $portableZip = Get-ChildItem 'artifacts/windows' -Filter '*_portable.zip' | Select-Object -First 1
          $msiPath = Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi' | Select-Object -First 1

          if (-not $portableZip -or -not $msiPath) {
            throw 'Missing one or more Windows artifacts to verify'
          }

          $portableRoot = Join-Path $env:RUNNER_TEMP 'portable-check'
          $msiRoot = Join-Path $env:RUNNER_TEMP 'msi-check'
          $msiLog = Join-Path $env:RUNNER_TEMP 'msi-admin.log'

          Remove-Item $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $msiRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $msiLog -Force -ErrorAction SilentlyContinue

          Expand-Archive -Path $portableZip.FullName -DestinationPath $portableRoot -Force

          $portableExe = Get-ChildItem $portableRoot -Recurse -Filter $appBinary | Select-Object -First 1
          if (-not $portableExe) {
            throw "Portable zip is missing $appBinary"
          }

          foreach ($runtimeFile in @('onnxruntime.dll', 'DirectML.dll', 'dxcompiler.dll', 'dxil.dll')) {
            if (-not (Get-ChildItem $portableRoot -Recurse -Filter $runtimeFile | Select-Object -First 1)) {
              throw "Portable zip is missing $runtimeFile"
            }
          }

          $process = Start-Process msiexec.exe -ArgumentList @('/a', $msiPath.FullName, '/qn', "TARGETDIR=$msiRoot", '/L*V', $msiLog) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $msiLog) {
              Get-Content $msiLog
            }
            throw "MSI administrative extraction failed with exit code $($process.ExitCode)"
          }

          $msiExe = Get-ChildItem $msiRoot -Recurse -Filter $appBinary | Select-Object -First 1
          if (-not $msiExe) {
            throw "MSI extraction is missing $appBinary"
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
