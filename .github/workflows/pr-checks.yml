name: pr-checks

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tauri-smoke:
    name: Smoke ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
          - os: windows-2022
            label: Windows
          - os: macos-14
            label: macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxdo-dev \
            libxtst-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Cache macOS transcription fixture model
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/warble-fixture-models
          key: macos-warble-fixture-model-v3-parakeet-tdt-0.6b-v3-int8

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS transcription fixture model
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          MODEL_DIR="$RUNNER_TEMP/warble-fixture-models/parakeet-tdt-0.6b-v3-int8"
          mkdir -p "$MODEL_DIR"
          curl -L --fail --retry 5 --retry-delay 5 \
            https://huggingface.co/smcleod/parakeet-tdt-0.6b-v3-int8/resolve/main/encoder-model.int8.onnx \
            -o "$MODEL_DIR/encoder-model.int8.onnx"
          curl -L --fail --retry 5 --retry-delay 5 \
            https://huggingface.co/smcleod/parakeet-tdt-0.6b-v3-int8/resolve/main/decoder_joint-model.int8.onnx \
            -o "$MODEL_DIR/decoder_joint-model.int8.onnx"
          curl -L --fail --retry 5 --retry-delay 5 \
            https://huggingface.co/smcleod/parakeet-tdt-0.6b-v3-int8/resolve/main/vocab.txt \
            -o "$MODEL_DIR/vocab.txt"

      - name: Generate macOS fixture speech WAV
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          say -v Samantha -r 170 -o "$RUNNER_TEMP/warble-ci-fixture.aiff" "Hello from Warble fixture"
          afconvert -f WAVE -d LEI16@16000 -c 1 \
            "$RUNNER_TEMP/warble-ci-fixture.aiff" \
            "$RUNNER_TEMP/warble-ci-fixture.wav"

      - name: Capture macOS fixture environment
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          {
            echo "=== sw_vers ==="
            sw_vers
            echo
            echo "=== uname -a ==="
            uname -a
            echo
            echo "=== system_profiler SPHardwareDataType SPDisplaysDataType ==="
            system_profiler SPHardwareDataType SPDisplaysDataType
          } | tee "$RUNNER_TEMP/warble-macos-fixture-environment.log"

      - name: Run frontend tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run macOS CPU fixture test
        if: runner.os == 'macOS' && vars.WARBLE_ENABLE_CPU_FIXTURE == 'true'
        timeout-minutes: 5
        env:
          WARBLE_MODEL_ROOT: ${{ runner.temp }}/warble-fixture-models
          WARBLE_FIXTURE_WAV: ${{ runner.temp }}/warble-ci-fixture.wav
          WARBLE_EXPECTED_WORDS: hello from warble fixture
          RUST_BACKTRACE: 1
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --test fixture_transcription transcribe_macos_ci_fixture_cpu_matches_expected_words -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/warble-macos-fixture-cpu.log"

      - name: Run macOS WebGPU fixture test
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          WARBLE_MODEL_ROOT: ${{ runner.temp }}/warble-fixture-models
          WARBLE_FIXTURE_WAV: ${{ runner.temp }}/warble-ci-fixture.wav
          WARBLE_EXPECTED_WORDS: hello from warble fixture
          WARBLE_MACOS_WEBGPU_LOAD_TIMEOUT_MS: 120000
          RUST_BACKTRACE: 1
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --test fixture_transcription transcribe_macos_ci_fixture_webgpu_matches_expected_words -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/warble-macos-fixture-webgpu.log"

      - name: Run macOS CoreML fixture test
        if: runner.os == 'macOS' && vars.WARBLE_ENABLE_COREML_FIXTURE == 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          WARBLE_MODEL_ROOT: ${{ runner.temp }}/warble-fixture-models
          WARBLE_FIXTURE_WAV: ${{ runner.temp }}/warble-ci-fixture.wav
          WARBLE_EXPECTED_WORDS: hello from warble fixture
          WARBLE_ENABLE_COREML_FIXTURE: 1
          RUST_BACKTRACE: 1
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --test fixture_transcription transcribe_macos_ci_fixture_coreml_matches_expected_words -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/warble-macos-fixture-coreml.log"

      - name: Upload macOS fixture audio on failure
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-transcription-fixture-debug
          path: |
            ${{ runner.temp }}/warble-ci-fixture.aiff
            ${{ runner.temp }}/warble-ci-fixture.wav
            ${{ runner.temp }}/warble-macos-fixture-environment.log
            ${{ runner.temp }}/warble-macos-fixture-cpu.log
            ${{ runner.temp }}/warble-macos-fixture-webgpu.log
            ${{ runner.temp }}/warble-macos-fixture-coreml.log

      - name: Run Tauri smoke build
        env:
          CI: true
        run: pnpm tauri build --debug --no-bundle --ci
