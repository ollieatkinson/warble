name: pr-checks

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tauri-smoke:
    name: Smoke ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
          - os: windows-2022
            label: Windows
          - os: macos-14
            label: macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxdo-dev \
            libxtst-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Cache macOS transcription fixture model
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/warble-fixture-models
          key: macos-warble-fixture-model-v3-parakeet-tdt-0.6b-v3-int8

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS transcription fixture model
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          MODEL_DIR="$RUNNER_TEMP/warble-fixture-models/parakeet-tdt-0.6b-v3-int8"
          mkdir -p "$MODEL_DIR"
          curl -L --fail --retry 5 --retry-delay 5 \
            https://huggingface.co/smcleod/parakeet-tdt-0.6b-v3-int8/resolve/main/encoder-model.int8.onnx \
            -o "$MODEL_DIR/encoder-model.int8.onnx"
          curl -L --fail --retry 5 --retry-delay 5 \
            https://huggingface.co/smcleod/parakeet-tdt-0.6b-v3-int8/resolve/main/decoder_joint-model.int8.onnx \
            -o "$MODEL_DIR/decoder_joint-model.int8.onnx"
          curl -L --fail --retry 5 --retry-delay 5 \
            https://huggingface.co/smcleod/parakeet-tdt-0.6b-v3-int8/resolve/main/vocab.txt \
            -o "$MODEL_DIR/vocab.txt"

      - name: Generate macOS fixture speech WAV
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          say -v Samantha -r 170 -o "$RUNNER_TEMP/warble-ci-fixture.aiff" "Hello from Warble fixture"
          afconvert -f WAVE -d LEI16@16000 -c 1 \
            "$RUNNER_TEMP/warble-ci-fixture.aiff" \
            "$RUNNER_TEMP/warble-ci-fixture.wav"

      - name: Capture macOS fixture environment
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          {
            echo "=== sw_vers ==="
            sw_vers
            echo
            echo "=== uname -a ==="
            uname -a
            echo
            echo "=== system_profiler SPHardwareDataType SPDisplaysDataType ==="
            system_profiler SPHardwareDataType SPDisplaysDataType
          } | tee "$RUNNER_TEMP/warble-macos-fixture-environment.log"

      - name: Detect macOS accelerator fixture support
        if: runner.os == 'macOS'
        id: macos_fixture_support
        run: |
          set -euxo pipefail
          if system_profiler SPHardwareDataType SPDisplaysDataType | grep -qi "Virtual Machine"; then
            echo "accelerator_fixtures_supported=false" >> "$GITHUB_OUTPUT"
            echo "cpu_fixture_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "accelerator_fixtures_supported=true" >> "$GITHUB_OUTPUT"
            echo "cpu_fixture_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Note macOS fixture policy
        if: runner.os == 'macOS' && steps.macos_fixture_support.outputs.accelerator_fixtures_supported != 'true'
        run: |
          echo "GitHub-hosted macOS exposes Apple Virtual Machine hardware. CPU fixture runs in diagnostics-only mode; WebGPU/CoreML fixtures are skipped because they are not representative of bare-metal Macs."

      - name: Run frontend tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run macOS CPU fixture test
        if: runner.os == 'macOS'
        id: macos_cpu_fixture
        continue-on-error: ${{ steps.macos_fixture_support.outputs.cpu_fixture_required != 'true' }}
        timeout-minutes: 5
        env:
          WARBLE_MODEL_ROOT: ${{ runner.temp }}/warble-fixture-models
          WARBLE_FIXTURE_WAV: ${{ runner.temp }}/warble-ci-fixture.wav
          WARBLE_EXPECTED_WORDS: hello from warble fixture
          WARBLE_ORT_LOG_PATH: ${{ runner.temp }}/warble-onnxruntime-cpu.log
          WARBLE_ENABLE_ORT_VERBOSE_LOGS: 1
          WARBLE_ECHO_ORT_LOGS: 1
          WARBLE_ORT_INTRA_THREADS: 1
          WARBLE_ORT_INTER_THREADS: 1
          WARBLE_ORT_GRAPH_OPT_LEVEL: disable
          WARBLE_ORT_PARALLEL_EXECUTION: 0
          WARBLE_ORT_MEMORY_PATTERN: 0
          RUST_BACKTRACE: 1
        run: |
          ./.github/scripts/run_macos_fixture_with_diagnostics.sh \
            "$RUNNER_TEMP/warble-macos-fixture-cpu.log" \
            "$RUNNER_TEMP/warble-macos-fixture-diagnostics" \
            "cpu-fixture" \
            cargo test --manifest-path src-tauri/Cargo.toml --test fixture_transcription transcribe_macos_ci_fixture_cpu_matches_expected_words -- --ignored --exact --nocapture

      - name: Run macOS WebGPU fixture test
        if: runner.os == 'macOS' && steps.macos_fixture_support.outputs.accelerator_fixtures_supported == 'true'
        id: macos_webgpu_fixture
        continue-on-error: true
        timeout-minutes: 5
        env:
          WARBLE_MODEL_ROOT: ${{ runner.temp }}/warble-fixture-models
          WARBLE_FIXTURE_WAV: ${{ runner.temp }}/warble-ci-fixture.wav
          WARBLE_EXPECTED_WORDS: hello from warble fixture
          WARBLE_ORT_LOG_PATH: ${{ runner.temp }}/warble-onnxruntime-webgpu.log
          WARBLE_ENABLE_ORT_VERBOSE_LOGS: 1
          WARBLE_ECHO_ORT_LOGS: 1
          RUST_BACKTRACE: 1
        run: |
          ./.github/scripts/run_macos_fixture_with_diagnostics.sh \
            "$RUNNER_TEMP/warble-macos-fixture-webgpu.log" \
            "$RUNNER_TEMP/warble-macos-fixture-diagnostics" \
            "webgpu-fixture" \
            cargo test --manifest-path src-tauri/Cargo.toml --test fixture_transcription transcribe_macos_ci_fixture_webgpu_matches_expected_words -- --ignored --exact --nocapture

      - name: Run macOS CoreML fixture test
        if: runner.os == 'macOS' && steps.macos_fixture_support.outputs.accelerator_fixtures_supported == 'true' && vars.WARBLE_ENABLE_COREML_FIXTURE == 'true'
        id: macos_coreml_fixture
        timeout-minutes: 5
        continue-on-error: true
        env:
          WARBLE_MODEL_ROOT: ${{ runner.temp }}/warble-fixture-models
          WARBLE_FIXTURE_WAV: ${{ runner.temp }}/warble-ci-fixture.wav
          WARBLE_EXPECTED_WORDS: hello from warble fixture
          WARBLE_ENABLE_COREML_FIXTURE: 1
          WARBLE_ORT_LOG_PATH: ${{ runner.temp }}/warble-onnxruntime-coreml.log
          WARBLE_ENABLE_ORT_VERBOSE_LOGS: 1
          WARBLE_ECHO_ORT_LOGS: 1
          RUST_BACKTRACE: 1
        run: |
          ./.github/scripts/run_macos_fixture_with_diagnostics.sh \
            "$RUNNER_TEMP/warble-macos-fixture-coreml.log" \
            "$RUNNER_TEMP/warble-macos-fixture-diagnostics" \
            "coreml-fixture" \
            cargo test --manifest-path src-tauri/Cargo.toml --test fixture_transcription transcribe_macos_ci_fixture_coreml_matches_expected_words -- --ignored --exact --nocapture

      - name: Note macOS CPU fixture diagnostic failure
        if: runner.os == 'macOS' && steps.macos_fixture_support.outputs.cpu_fixture_required != 'true' && steps.macos_cpu_fixture.outcome == 'failure'
        run: |
          echo "macOS CPU fixture did not complete on GitHub's virtual Apple runner. See the uploaded diagnostics artifacts for ORT logs, process snapshots, and sample traces."

      - name: Upload macOS fixture audio on failure
        if: runner.os == 'macOS' && (failure() || steps.macos_cpu_fixture.outcome == 'failure' || steps.macos_webgpu_fixture.outcome == 'failure' || steps.macos_coreml_fixture.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: macos-transcription-fixture-debug
          path: |
            ${{ runner.temp }}/warble-ci-fixture.aiff
            ${{ runner.temp }}/warble-ci-fixture.wav
            ${{ runner.temp }}/warble-macos-fixture-environment.log
            ${{ runner.temp }}/warble-macos-fixture-cpu.log
            ${{ runner.temp }}/warble-macos-fixture-webgpu.log
            ${{ runner.temp }}/warble-macos-fixture-coreml.log
            ${{ runner.temp }}/warble-macos-fixture-diagnostics
            ${{ runner.temp }}/warble-onnxruntime-cpu.log
            ${{ runner.temp }}/warble-onnxruntime-webgpu.log
            ${{ runner.temp }}/warble-onnxruntime-coreml.log

      - name: Run Tauri smoke build
        env:
          CI: true
        run: pnpm tauri build --debug --no-bundle --ci
